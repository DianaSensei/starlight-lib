[workspace]
resolver = "3"
members = [
    "starlight-auth",
    
    "starlight-core",
    "starlight-db",
    
    "starlight-i18n",
    "starlight-messaging",
    
    "starlight-protocol",
    "starlight-telemetry",
    "starlight-web",
    
    "starlight-utils",
    
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/DianaSensei/starlight-lib"

[workspace.dependencies]
starlight-auth = { path = "starlight-auth" }
starlight-core = { path = "starlight-core" }
starlight-db = { path = "starlight-db" }
starlight-messaging = { path = "starlight-messaging" }
starlight-protocol = { path = "starlight-protocol" }
starlight-telemetry = { path = "starlight-telemetry" }
starlight-web = { path = "starlight-web" }

async-nats = "0.50"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
config = { version = "0.15", default-features = false, features = ["yaml"] }
http = "1"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
opentelemetry = "0.31"
opentelemetry-appender-tracing = "0.31"
opentelemetry-http = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = { version = "0.31", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace", "metrics", "logs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-json",
    "with-time",
    "with-uuid",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "limit", "set-header", "timeout"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
uuid = { version = "1", features = ["serde", "v7"] }
validator = { version = "0.20", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "deny"
print_stdout = "deny"
# Problem (RFC 9457) is built once per failed request; boxing it adds noise without measurable gain.
result_large_err = "allow"
todo = "warn"
unwrap_used = "warn"
